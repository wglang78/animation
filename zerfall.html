:var(--shell);color:var(--surface)}\n.main{display:flex;flex-direction:column;gap:8px}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}\n\n/* Bühne */\n.stagecard{\n  padding:6px 10px 6px;display:flex;flex-direction:column;gap:4px;min-width:0;\n  background:radial-gradient(var(--grid) 1px,transparent 1.6px) 0 0/16px 16px,linear-gradient(160deg,var(--stage-a),var(--stage-b));\n  box-shadow:inset 0 0 0 1px var(--line),0 6px 18px -10px rgba(0,0,0,.35);\n}\n.orbit{fill:none;stroke:var(--orbit);stroke-width:1.2;stroke-dasharray:2 6;stroke-linecap:round}\n.svgbox{position:relative;width:100%;padding-top:35.8%}\n.svgbox svg{position:absolute;top:0;left:0;width:100%;height:100%;display:block}\n.dot{stroke:var(--edge);stroke-width:1}\n.dot.p{fill:url(#gp)}\n.dot.n{fill:url(#gn)}\n#rest,#alpha{transition:transform 1s cubic-bezier(.4,0,.2,1)}\n#alpha{transform-box:fill-box;transform-origin:50% 50%}\n#alpha circle.dot{transition:transform 1s cubic-bezier(.4,0,.2,1)}\n#alpha.out{transform:translate(230px,-14px) scale(2.2)}\n#rest.recoil{transform:translate(-10px,0)}\n#ring{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-dasharray:5 4;opacity:0;transition:opacity .4s}\n#ring.on{opacity:1;animation:pulse 1.4s ease-in-out infinite}\n@keyframes pulse{50%{stroke-opacity:.35}}\n#trail{stroke:var(--accent);stroke-width:1.8;stroke-dasharray:6 5;fill:none;opacity:0;transition:opacity .5s}\n#trail.on{opacity:.8}\n.lbl{font-family:var(--font-body);font-size:16px;font-weight:700;fill:var(--fg);transition:opacity .4s}\n.lbl.nl{font-size:13px;font-weight:600;fill:var(--muted)}\n.lbl.sub{font-weight:600;fill:var(--muted);font-size:14px}\n.hide{opacity:0}\n.legend{display:flex;gap:2px 14px;flex-wrap:wrap;justify-content:center;font-size:.76rem;color:var(--muted)}\n.legend span{display:inline-flex;align-items:center;gap:5px}\n.legend i{width:11px;height:11px;border-radius:50%;display:inline-block}\n.legend .lp{background:var(--accent)}.legend .ln{background:var(--neutron)}\n\n/* Panel */\n.panel{display:flex;flex-direction:column;gap:8px;min-width:0}\n.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}\n.chip{border:1px solid var(--line);border-radius:10px;padding:3px 8px;background:var(--surface);min-width:0;display:flex;justify-content:space-between;align-items:baseline;gap:6px}\n.chip small{color:var(--muted);font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}\n.chip b{font-family:var(--font-display);font-size:1.2rem;font-weight:800;font-variant-numeric:tabular-nums}\n.chip.unk b{color:var(--muted)}\n.chip.hl{border-color:var(--accent);background:var(--accent-soft)}\n.chip.hl b{color:var(--accent)}\n\n.eqcard{padding:8px 8px 6px;display:flex;flex-direction:column;gap:6px}\n.eq{display:flex;align-items:flex-start;justify-content:center;gap:clamp(2px,1.4vw,12px);flex-wrap:wrap}\n.term{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}\n.term small{color:var(--muted);font-size:.72rem;font-weight:600;text-align:center;line-height:1.2}\n.op{font-family:var(--font-display);font-size:1.5rem;line-height:1.7;color:var(--muted);font-weight:600}\n.nuc{display:inline-flex;align-items:center;gap:2px;font-family:var(--font-display);font-weight:800;font-size:clamp(1.6rem,4.6vw,2.15rem);line-height:1;padding:3px 5px;border-radius:10px}\n.nuc .ab{display:inline-flex;flex-direction:column;gap:3px;font-size:.52em;text-align:right;font-variant-numeric:tabular-nums}\n.nuc .ab i{font-style:normal;padding:0 3px;border-radius:6px;border:2px solid transparent;min-width:1.4em}\n.nuc b{font-weight:800;padding:0 4px;border-radius:6px;border:2px solid transparent}\n.unk{color:var(--muted);border-color:var(--line)!important;border-style:dashed!important}\n.hl{background:var(--accent-soft);border-color:var(--accent)!important;color:var(--accent)}\n.calc{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;min-height:1.9rem;font-varian eader class=\"head\">\n    <h1>Alpha-Zerfall<\/h1>\n    <div class=\"isos\" id=\"isos\" role=\"group\" aria-label=\"Isotop wählen\"><\/div>\n  <\/header>\n\n  <div class=\"main\">\n    <section class=\"card stagecard\" aria-label=\"Darstellung des Atomkerns\">\n      <div class=\"svgbox\">\n        <svg id=\"stage\" viewBox=\"0 0 600 215\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"Atomkern aus Protonen und Neutronen\">\n          <defs>\n            <marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10z\" fill=\"var(--accent)\"/><\/marker>\n            <radialGradient id=\"gp\" cx=\".35\" cy=\".3\" r=\".85\"><stop offset=\"0\" style=\"stop-color:var(--p-hi)\"/><stop offset=\".5\" style=\"stop-color:var(--accent)\"/><stop offset=\"1\" style=\"stop-color:var(--p-lo)\"/><\/radialGradient>\n            <radialGradient id=\"gn\" cx=\".35\" cy=\".3\" r=\".85\"><stop offset=\"0\" style=\"stop-color:var(--n-hi)\"/><stop offset=\".5\" style=\"stop-color:var(--neutron)\"/><stop offset=\"1\" style=\"stop-color:var(--n-lo)\"/><\/radialGradient>\n            <radialGradient id=\"gg\"><stop offset=\"0\" style=\"stop-color:var(--shell);stop-opacity:.34\"/><stop offset=\"1\" style=\"stop-color:var(--shell);stop-opacity:0\"/><\/radialGradient>\n          <\/defs>\n          <circle id=\"glow\" fill=\"url(#gg)\"/>\n          <ellipse id=\"o1\" class=\"orbit\"/><ellipse id=\"o2\" class=\"orbit\"/>\n          <path id=\"trail\" marker-end=\"url(#ah)\"/>\n          <g id=\"rest\"><\/g>\n          <g id=\"alpha\"><\/g>\n          <text id=\"lblNuc\" class=\"lbl nl\" text-anchor=\"middle\"><\/text>\n          <text id=\"lblAlpha\" class=\"lbl hide\" text-anchor=\"middle\">α-Teilchen<\/text>\n          <text id=\"lblAlpha2\" class=\"lbl sub hide\" text-anchor=\"middle\">= Heliumkern<\/text>\n        <\/svg>\n      <\/div>\n      <div class=\"legend\"><span><i class=\"lp\"><\/i>Proton (positiv)<\/span><span><i class=\"ln\"><\/i>Neutron (neutral)<\/span><span>vereinfachtes Modell<\/span><\/div>\n    <\/section>\n\n    <div class=\"panel\">\n      <div class=\"chips\" id=\"chips\"><\/div>\n      <section class=\"card eqcard\" aria-label=\"Zerfallsgleichung\">\n        <div class=\"eq\" id=\"eq\"><\/div>\n        <div class=\"calc\" id=\"calc\"><\/div>\n      <\/section>\n      <section class=\"card text\"><div class=\"tstack\" id=\"tstack\"><\/div><\/section>\n      <div class=\"nav\">\n        <button type=\"button\" class=\"btn ghost\" id=\"prev\">Zurück<\/button>\n        <div class=\"segs\" id=\"segs\" aria-label=\"Schritte\"><\/div>\n        <button type=\"button\" class=\"btn primary\" id=\"next\">Weiter<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\n/* ---------- Daten ---------- */\nvar EL={95:['Am','Americium'],93:['Np','Neptunium'],92:['U','Uran'],90:['Th','Thorium'],88:['Ra','Radium'],86:['Rn','Radon'],84:['Po','Polonium'],82:['Pb','Blei']};\nvar ISOS=[\n {A:241,Z:95,note:\"Americium-241 wird in manchen Rauchmeldern verwendet.\"},\n {A:238,Z:92,note:\"Thorium-234 ist selbst wieder radioaktiv.\"},\n {A:235,Z:92,note:\"Uran-235 ist das Isotop, das in Kernkraftwerken gespalten wird.\"},\n {A:232,Z:90,note:\"Thorium-232 ist das häufigste natürliche Thorium-Isotop.\"},\n {A:226,Z:88,note:\"Das Element Radium entdeckten Marie und Pierre Curie.\"},\n {A:222,Z:86,note:\"Radon ist ein radioaktives Edelgas.\"},\n {A:210,Z:84,note:\"Blei-206 ist stabil, die Zerfallsreihe endet hier.\"}\n];\nvar cur=1, step=0, iso, d, dots=[];\nfunction nm(Z){return EL[Z][1]} function sy(Z){return EL[Z][0]}\n\n/* ---------- Kern zeichnen: dicht gepackte, sich überlappende Nukleonen ---------- */\nvar CX=150, CY=92, RD=5.8;\nfunction rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}\n/* Protonen und Neutronen gleichmäßig verteilen: Nachbarn gleicher Sorte werden durch Tauschen möglichst vermieden */\nfunction assignTypes(pts,nP,fixed,rnd){\n  var A=pts.length,T=[],free=[],pLeft=nP,i,j,t,a,b;\n  Object.keys(fixed).forEach(function(key){if(fixed[key]==='p')pLeft--});\n  for(i=0;i<A;i++){if(fixed[i])T[i]=fixed[i];else free.push(i)}\n  var pool=[];for(i=0;i<free.length;i++)pool.push(i<pLeft?'p':'n');\n  for(i=pool.length-1;i>0;i--){j=Math.floor(rnd()*(i+1));t=pool[i];pool[i]=pool[j];pool[j]=t}\n  free.forEach(function(k,x){T[k]=pool[x]});\n  var dm=1e9;\n  for(i=0;i<A;i++)for(j=i+1;j<A;j++){var d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);if(d<dm)dm=d}\n  var thr=dm*1.7,nb=[];\n  for(i=0;i<A;i++){nb[i]=[];for(j=0;j<A;j++)if(j!==i&&Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y)<thr)nb[i].push(j)}\n  function same(k){var c=0;for(var q=0;q<nb[k].length;q++)if(T[nb[k][q]]===T[k])c++;return c}\n  for(var it=0;it<9000&&free.length>1;it++){\n    a=free[Math.floor(rnd()*free.length)];b=free[Math.floor(rnd()*free.length)];\n    if(T[a]===T[b])continue;\n    var before=same(a)+same(b);\n    t=T[a];T[a]=T[b];T[b]=t;\n    if(same(a)+same(b)>before){t=T[a];T[a]=T[b];T[b]=t}\n  }\n  return T;\n}\nvar rest=document.getElementById('rest'), alpha=document.getElementById('alpha');\nvar trail=document.getElementById('trail'), lblNuc=document.getElementById('lblNuc');\nvar la=document.getElementById('lblAlpha'), la2=document.getElementById('lblAlpha2'), ring;\n\nfunction build(){\n  var A=iso.A, Z=iso.Z, N=A-Z, rnd=rng(A*31+Z);\n  var RN=70*Math.sqrt(A/238), dmin=6.9, cell=dmin, grid={}, pts=[], tries=0;\n  while(pts.length<A-4){\n    if(++tries>30000){dmin-=0.2;tries=0}\n    var rr=RN*1.02*Math.sqrt(rnd()), tt=rnd()*6.283185;\n    var x=CX+rr*Math.cos(tt), y=CY+rr*Math.sin(tt), ix=Math.floor(x/cell), iy=Math.floor(y/cell), ok=true;\n    for(var a=-1;a<=1&&ok;a++)for(var b=-1;b<=1&&ok;b++){\n      var L=grid[(ix+a)*1000+(iy+b)];\n      if(L)for(var q=0;q<L.length;q++){var dx=L[q].x-x,dy=L[q].y-y;if(dx*dx+dy*dy<dmin*dmin){ok=false;break}}\n    }\n    if(ok){var P={k:pts.length,x:x,y:y};pts.push(P);(grid[ix*1000+iy]=grid[ix*1000+iy]||[]).push(P)}\n  }\n  var T={x:CX+RN*.86*Math.cos(-.2),y:CY+RN*.86*Math.sin(-.2)};\n  var near=pts.map(function(p){return{p:p,d:Math.hypot(p.x-T.x,p.y-T.y)}}).sort(function(u,v){return u.d-v.d}).slice(0,4).map(function(o){return o.p.k});\n  var i,j,tmp,fixed={};\n  var aTypes=['p','n','n','p'], aOff=[[-4.8,-4.8],[4.8,-4.4],[-4.4,4.8],[4.8,4.8]];\n  var T=assignTypes(pts,Z-2,{},rnd);\n  var cx=0,cy=0;near.forEach(function(k){cx+=pts[k].x;cy+=pts[k].y});cx/=4;cy/=4;\n  var order=pts.map(function(p){return p.k});\n  for(i=order.length-1;i>0;i--){j=Math.floor(rnd()*(i+1));tmp=order[i];order[i]=order[j];order[j]=tmp}\n  var typeFor=T;\n  var rh='',ah='<circle id=\"ring\" cx=\"'+cx.toFixed(1)+'\" cy=\"'+cy.toFixed(1)+'\" r=\"17\"/>';\n  /* Der Rest des Kerns ist vollständig gepackt. Die vier α-Bausteine liegen davor und decken ihre Nachbarn ab, nach dem Abflug sind diese zu sehen. */\n  order.forEach(function(k){var p=pts[k]; rh+='<circle class=\"dot '+typeFor[k]+'\" cx=\"'+p.x.toFixed(1)+'\" cy=\"'+p.y.toFixed(1)+'\" r=\"'+RD+'\"/>'});\n  near.forEach(function(k,n){\n    var p=pts[k], ox=p.x-CX, oy=p.y-CY, ol=Math.hypot(ox,oy)||1, ax=p.x+ox/ol*2.2, ay=p.y+oy/ol*2.2;\n    ah+='<circle class=\"dot '+aTypes[n]+'\" cx=\"'+ax.toFixed(1)+'\" cy=\"'+ay.toFixed(1)+'\" r=\"'+RD+'\" data-tx=\"'+((cx+aOff[n][0])-ax).toFixed(1)+'\" data-ty=\"'+((cy+aOff[n][1])-ay).toFixed(1)+'\"/>';\n  });\n  rest.innerHTML=rh; alpha.innerHTML=ah;\n  ring=document.getElementById('ring');\n  dots=alpha.querySelectorAll('circle.dot');\n  var fx=cx+230, fy=cy-14;\n  trail.setAttribute('d','M'+(cx+24).toFixed(0)+','+cy.toFixed(0)+' L'+(fx-40).toFixed(0)+','+fy.toFixed(0));\n  var gl=document.getElementById('glow'); gl.setAttribute('cx',CX);gl.setAttribute('cy',CY);gl.setAttribute('r',(RN+62).toFixed(0));\n  var orx=RN+RD+52, ory=orx*.36;\n  ['o1','o2'].forEach(function(id,n){var o=document.getElementById(id);o.setAttribute('cx',CX);o.setAttribute('cy',CY);o.setAttribute('rx',orx.toFixed(0));o.setAttribute('ry',ory.toFixed(0));o.setAttribute('transform','rotate('+(n?-26:26)+' '+CX+' '+CY+')')});\n  lblNuc.setAttribute('x',CX); lblNuc.setAttribute('y',(CY+RN*1.02+RD+30).toFixed(0));\n  la.setAttribute('x',fx);la.setAttribute('y',fy+50);la2.setAttribute('x',fx);la2.setAttribute('y',fy+68);\n}\n\n/* ---------- Texte (aus den Zahlen des gewählten Isotops) ---------- */\nfunction steps(){\n  var A=iso.A,Z=iso.Z,N=A-Z,A2=d.A,Z2=d.Z,N2=A2-Z2;\n  return [\n   {t:\"Ausgangslage: ein \"+nm(Z)+\"-\"+A+\"-Kern\",\n    b:\"Der Kern enthält \"+Z+\" Protonen und \"+N+\" Neutronen, zusammen \"+A+\" Nukleonen. In der Nuklidschreibweise steht die Nukleonenzahl A = \"+A+\" oben und die Ordnungszahl Z = \"+Z+\" unten, daneben das Symbol \"+sy(Z)+\".\"},\n   {t:\"Der Kern ist instabil\",\n    b:nm(Z)+\"-\"+A+\" ist radioaktiv. Sein Kern wandelt sich von alleine um. Am Rand finden sich zwei Protonen und zwei Neutronen zu einer Vierergruppe zusammen (rot gestrichelt).\"},\n   {t:\"Ein α-Teilchen verlässt den Kern\",\n    b:\"Die Vierergruppe wird als α-Strahlung abgegeben. Zwei Protonen und zwei Neutronen bilden einen Heliumkern, kurz ⁴₂He. Zurück bleibt ein kleinerer Kern. Wie er heißt, finden wir gleich heraus.\"},\n   {t:\"Die Massenzahl nimmt um 4 ab\",\n    b:\"Der Heliumkern nimmt 4 Nukleonen mit. Der Restkern hat deshalb nur noch \"+A+\" − 4 = \"+A2+\" Nukleonen. Die Nukleonenzahl A oben links wird um 4 kleiner.\"},\n   {t:\"Die Ordnungszahl nimmt um 2 ab\",\n    b:\"Mit dem Heliumkern sind auch 2 Protonen verschwunden. Der Restkern hat \"+Z+\" − 2 = \"+Z2+\" Protonen. Weil die Protonenzahl das Element bestimmt, ist es kein \"+nm(Z)+\" mehr.\"},\n   {t:\"Ein neues Element ist entstanden\",\n    b:\"Im Periodensystem steht bei der Ordnungszahl \"+Z2+\" \"+(Z2===82?\"das Element Blei (Pb)\":\"das Element \"+nm(Z2)+\" (\"+sy(Z2)+\")\")+\". Der Restkern ist \"+nm(Z2)+\"-\"+A2+\" mit \"+Z2+\" Protonen und \"+N2+\" Neutronen. \"+iso.note}\n  ];\n}\n\nfunction nuc(A,Z,S,o){\n  o=o||{};\n  return '<span class=\"nuc\"><span class=\"ab\"><i class=\"'+(o.a||'')+'\">'+A+'<\/i><i class=\"'+(o.z||'')+'\">'+Z+'<\/i><\/span><b class=\"'+(o.s||'')+'\">'+S+'<\/b><\/span>';\n}\nfunction term(h,label){return '<div class=\"term\">'+h+'<small>'+label+'<\/small><\/div>'}\nfunction chip(label,val,known,hl){return '<div class=\"chip'+(known?'':' unk')+(hl?' hl':'')+'\"><small>'+label+'<\/small><b>'+(known?val:'?')+'<\/b><\/div>'}\n\nfunction render(){\n  var s=step, A=iso.A, Z=iso.Z, N=A-Z, A2=d.A, Z2=d.Z, N2=A2-Z2, h='';\n  var out=s>=2;\n  alpha.classList.toggle('out',out);\n  rest.classList.toggle('recoil',out);\n  for(var k=0;k<dots.length;k++) dots[k].style.transform = out ? 'translate('+dots[k].getAttribute('data-tx')+'px,'+dots[k].getAttribute('data-ty')+'px)' : 'none';\n  ring.classList.toggle('on',s===1);\n  trail.classList.toggle('on',s===2||s===3);\n  la.classList.toggle('hide',s<2);la2.classList.toggle('hide',s<2);\n  lblNuc.textContent = s<=1 ? nm(Z)+'kern ('+nm(Z)+'-'+A+')' : s<=4 ? 'Restkern' : nm(Z2)+'kern ('+nm(Z2)+'-'+A2+')';\n  var pK=s<=1||s>=4, nK=s<=1||s>=5, aK=s<=1||s>=3;\n  document.getElementById('chips').innerHTML =\n    chip('Protonen', s<=1?Z:Z2, pK, s===4) + chip('Neutronen', s<=1?N:N2, nK, s===5) + chip('Nukleonen', s<=1?A:A2, aK, s===3);\n  if(s<=1){ h=term(nuc(A,Z,sy(Z)), nm(Z)+'-'+A); }\n  else {\n    var vA=s>=3?A2:'?', vZ=s>=4?Z2:'?', vS=s>=5?sy(Z2):'?';\n    h = term(nuc(A,Z,sy(Z)), nm(Z)+'-'+A)\n      + '<div class=\"op\" aria-hidden=\"true\">→<\/div>'\n      + term(nuc(vA,vZ,vS,{a:s===3?'hl':(s<3?'unk':''), z:s===4?'hl':(s<4?'unk':''), s:s===5?'hl':(s<5?'unk':'')}), s>=5 ? nm(Z2)+'-'+A2 : 'Restkern')\n      + '<div class=\"op\" aria-hidden=\"true\">+<\/div>'\n      + term(nuc(4,2,'He'),'α-Teilchen (Helium-4)');\n  }\n  document.getElementById('eq').innerHTML=h;\n  var c='';\n  if(s===3) c='<p class=\"new\">Oben: '+A+' − 4 = '+A2+'<\/p>';\n  if(s===4) c='<p>Oben: '+A+' − 4 = '+A2+'<\/p><p class=\"new\">Unten: '+Z+' − 2 = '+Z2+'<\/p>';\n  if(s===5) c='<p>Kontrolle oben: '+A2+' + 4 = '+A+'<\/p><p>Kontrolle unten: '+Z2+' + 2 = '+Z+'<\/p>';\n  document.getElementById('calc').innerHTML=c;\n  for(var t=0;t<6;t++)document.getElementById('ts'+t).classList.toggle('on',t===s);\n  var sg='';\n  for(var i=0;i<6;i++) sg+='<button type=\"button\" class=\"seg'+(i<s?' done':'')+(i===s?' cur':'')+'\" data-i=\"'+i+'\" aria-label=\"Schritt '+(i+1)+' von 6\"'+(i===s?' aria-current=\"step\"':'')+'><span><\/span><\/button>';\n  document.getElementById('segs').innerHTML=sg;\n  document.getElementById('prev').disabled=s===0;\n  document.getElementById('next').textContent=s===5?'Von vorn':'Weiter';\n}\n\nfunction select(n){\n  cur=n; iso=ISOS[n]; d={A:iso.A-4,Z:iso.Z-2}; step=0;\n  build();\n  document.getElementById('tstack').innerHTML=steps().map(function(s,i){return '<div class=\"tstep\" id=\"ts'+i+'\"><h2>'+s.t+'<\/h2><p>'+s.b+'<\/p><\/div>'}).join('');\n  document.getElementById('isos').innerHTML='<span class=\"cap\">Isotop<\/span>'+ISOS.map(function(o,i){\n    return '<button type=\"button\" class=\"iso\" data-n=\"'+i+'\" aria-pressed=\"'+(i===n)+'\">'+sy(o.Z)+'-'+o.A+'<\/button>';\n  }).join('');\n  render();\n}\nfunction go(n){step=Math.max(0,Math.min(5,n));render()}\ndocument.getElementById('next').addEventListener('click',function(){go(step===5?0:step+1)});\ndocument.getElementById('prev').addEventListener('click',function(){go(step-1)});\ndocument.getElementById('segs').addEventListener('click',function(e){var b=e.target.closest('button');if(b)go(Number(b.dataset.i))});\ndocument.getElementById('isos').addEventListener('click',function(e){var b=e.target.closest('button');if(b)select(Number(b.dataset.n))});\ndocument.addEventListener('keydown',function(e){if(e.key==='ArrowRight')go(step+1);if(e.key==='ArrowLeft')go(step-1)});\nselect(cur);\n/* Große Bildschirme: ganze Oberfläche passend vergrößern (nie kleiner als 1) */\nfunction fitScale(){\n  var app=document.querySelector('.app'), z=1;\n  if(window.innerWidth>=900){ z=Math.max(1,Math.min(window.innerWidth/1180,window.innerHeight/560,2.4)); }\n  app.style.zoom=z>1.04?z.toFixed(3):'';\n}\nwindow.addEventListener('resize',fitScale); fitScale();\n<\/script>\n<script>(function(){var c=document.querySelector('.stagecard');if(!c)return;var w=document.createElement('div');w.className='warn';w.setAttribute('role','img');w.setAttribute('aria-label','Warnzeichen: radioaktiv');w.innerHTML='<svg viewBox=\"0 0 100 100\" aria-hidden=\"true\"><circle cx=\"50\" cy=\"50\" r=\"46\" fill=\"#ffd21f\" stroke=\"#1a1a1a\" stroke-width=\"6\"/><path d=\"M68.7,17.6 A37.4,37.4 0 0 0 31.3,17.6 L43.6,39.0 A12.7,12.7 0 0 1 56.4,39.0 Z M12.6,50.0 A37.4,37.4 0 0 0 31.3,82.4 L43.6,61.0 A12.7,12.7 0 0 1 37.3,50.0 Z M68.7,82.4 A37.4,37.4 0 0 0 87.4,50.0 L62.7,50.0 A12.7,12.7 0 0 1 56.4,61.0 Z \" fill=\"#1a1a1a\"/><circle cx=\"50\" cy=\"50\" r=\"6.4\" fill=\"#1a1a1a\"/><\/svg>';c.insertBefore(w,c.firstChild)})();<\/script><\/body><\/html>",beta:"<!DOCTYPE html><html lang=\"de\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"><meta name=\"color-scheme\" content=\"light dark\"><title>Beta-Zerfall<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap\">\n<style>\nhtml{-webkit-text-size-adjust:100%}body{margin:0}\n\n/* Layout wie bei der Alpha-Animation: Kopf mit Isotop-Knöpfen und Ton-Knopf, kleine Bühne wie eine Nebelkammer (Punktraster, Glühen, schwache Bahnen) mit dem dichten, schattierten Kern, darunter Zähler, Gleichung, Text und Bedienung. */\n:root{\n  --bg:#eef1f4;\n  --bg-glow:rgba(11,111,123,.12);\n  --surface:#ffffff;\n  --fg:#14202b;\n  --muted:#556473;\n  --line:#d2d9e0;\n  --accent:#b3261e;      /* Protonen, Hervorhebung */\n  --accent-ink:#ffffff;\n  --accent-soft:#f8e4e2;\n  --shell:#0b6f7b;       /* Elektron, Auswahl, Fortschritt */\n  --neutron:#8b98a5;\n  --p-hi:#ff9a8f; --p-lo:#8f1812;\n  --n-hi:#d6dde4; --n-lo:#68757f;\n  --edge:rgba(20,32,43,.34);\n  --stage-a:#fbfdfe; --stage-b:#d9e5ec;\n  --grid:rgba(11,111,123,.16);\n  --orbit:rgba(85,100,115,.42);\n  --font-display:\"Bricolage Grotesque\",\"Avenir Next\",\"Segoe UI\",system-ui,sans-serif;\n  --font-body:\"Source Sans 3\",\"Avenir Next\",\"Segoe UI\",system-ui,sans-serif;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#0e161d;--bg-glow:rgba(82,196,208,.10);--surface:#17222c;--fg:#e8eef3;--muted:#9aabb9;--line:#2b3a47;\n    --accent:#ff7d70;--accent-ink:#1c0806;--accent-soft:#3a1d1a;\n    --shell:#52c4d0;--neutron:#8fa1b3;\n    --p-hi:#ffc2ba;--p-lo:#b8372c;--n-hi:#c4d1dd;--n-lo:#566a7c;--edge:rgba(0,0,0,.45);\n    --stage-a:#1f3140;--stage-b:#0d171e;--grid:rgba(130,205,215,.12);--orbit:rgba(154,171,185,.38);\n    color-scheme:dark;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#0e161d;--bg-glow:rgba(82,196,208,.10);--surface:#17222c;--fg:#e8eef3;--muted:#9aabb9;--line:#2b3a47;\n  --accent:#ff7d70;--accent-ink:#1c0806;--accent-soft:#3a1d1a;\n  --shell:#52c4d0;--neutron:#8fa1b3;\n  --p-hi:#ffc2ba;--p-lo:#b8372c;--n-hi:#c4d1dd;--n-lo:#566a7c;--edge:rgba(0,0,0,.45);\n  --stage-a:#1f3140;--stage-b:#0d171e;--grid:rgba(130,205,215,.12);--orbit:rgba(154,171,185,.38);\n  color-scheme:dark;\n}\n*{box-sizing:border-box}\nhtml,body{height:100%}\nbody{\n  background:radial-gradient(900px 420px at 15% -8%,var(--bg-glow),transparent 70%),var(--bg);\n  color:var(--fg);\n  font-family:var(--font-body);font-size:16px;line-height:1.4;\n  padding-block:8px;\n  padding-left:max(16px,env(safe-area-inset-left,0px));\n  padding-right:max(16px,env(safe-area-inset-right,0px));\n  -webkit-text-size-adjust:100%;\n}\nh1,h2{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.15}\np{margin:0}\nbutton{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}\nbutton:focus-visible{outline:3px solid var(--shell);outline-offset:3px}\n\n.app{max-width:1100px;margin-inline:auto;min-height:100%;display:flex;flex-direction:column;gap:8px;min-width:0}\n.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px}\nh1{font-size:clamp(1.8rem,5vw,2.4rem);font-weight:800}\n.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.isos{display:flex;flex-wrap:wrap;gap:6px;align-items:center}\n.isos .cap{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:2px}\n.iso{min-height:44px;padding:0 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:.98rem;cursor:pointer;font-variant-numeric:tabular-nums}\n.iso[aria-pressed=\"true\"]{background:var(--shell);border-color:var(--shell);color:var(--surface)}\n.main{display:flex;flex-direction:column;gap:8px}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}\n\n/* Bühne */\n.stagecard{\n  padding:6px 10px 6px;display:flex;flex-direction:column;gap:4px;min-width:0;\n  background:radial-gradient(var(--grid) 1px,transparent 1.6px) 0 0/16px 16px,linear-gradient(160deg,var(--stage-a),var(--stage-b));\n  box-shadow:inset 0 0 0 1px var(--line),0 6px 18px -10px rgba(0,0,0,.35);\n}\n.svgbox{position:relative;width:100%;padding-top:35.8%}\n.svgbox svg{position:absolute;top:0;left:0;width:100%;height:100%;display:block}\n.orbit{fill:none;stroke:var(--orbit);stroke-width:1.2;stroke-dasharray:2 6;stroke-linecap:round}\n.dot{stroke:var(--edge);stroke-width:1}\n.dot.p{fill:url(#gp)}\n.dot.n{fill:url(#gn)}\n#conv.pop{animation:pop .8s ease-out;transform-box:fill-box;transform-origin:50% 50%}\n@keyframes pop{35%{tran tart;justify-content:center;gap:clamp(2px,1.4vw,12px);flex-wrap:wrap}\n.term{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}\n.term small{color:var(--muted);font-size:.72rem;font-weight:600;text-align:center;line-height:1.2}\n.op{font-family:var(--font-display);font-size:1.5rem;line-height:1.7;color:var(--muted);font-weight:600}\n.nuc{display:inline-flex;align-items:center;gap:2px;font-family:var(--font-display);font-weight:800;font-size:clamp(1.6rem,4.6vw,2.15rem);line-height:1;padding:3px 5px;border-radius:10px}\n.nuc .ab{display:inline-flex;flex-direction:column;gap:3px;font-size:.52em;text-align:right;font-variant-numeric:tabular-nums}\n.nuc .ab i{font-style:normal;padding:0 3px;border-radius:6px;border:2px solid transparent;min-width:1.4em}\n.nuc b{font-weight:800;padding:0 4px;border-radius:6px;border:2px solid transparent}\n.nuc.sm{font-size:1.15rem;padding:0 2px}\n.nuc.sm .ab i{border-width:0;padding:0 1px;min-width:1em}\n.nuc.sm b{padding:0 2px;border-width:0}\n.unk{color:var(--muted);border-color:var(--line)!important;border-style:dashed!important}\n.hl{background:var(--accent-soft);border-color:var(--accent)!important;color:var(--accent)}\n.calc{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;min-height:2.3rem;font-variant-numeric:tabular-nums}\n.calc p{font-weight:600;font-size:.9rem;padding:2px 10px;border-radius:9px;background:var(--bg);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}\n.calc p.new{border-color:var(--accent);background:var(--accent-soft)}\n\n.text{padding:9px 14px}\n.tstack{display:grid}\n.tstep{grid-area:1/1;visibility:hidden;display:flex;flex-direction:column;gap:2px}\n.tstep.on{visibility:visible}\n.tstep h2{font-size:1.1rem;font-weight:600}\n.tstep p{font-size:.95rem}\n\n/* Bedienung */\n.nav{position:sticky;bottom:0;background:var(--bg);display:flex;gap:8px;align-items:center;padding-block:4px 2px;padding-bottom:max(2px,env(safe-area-inset-bottom,0 er Haufen auf einem Sechseck-Raster */\n    var sp=1.74*RD, rot=rnd()*6.283185, ox=(rnd()-.5)*sp*.6, oy=(rnd()-.5)*sp*.6, cand=[];\n    for(var qa=-5;qa<=5;qa++)for(var qb=-5;qb<=5;qb++){\n      var lx=(qa+qb*.5)*sp, ly=qb*sp*.8660254;\n      cand.push({x:lx*Math.cos(rot)-ly*Math.sin(rot), y:lx*Math.sin(rot)+ly*Math.cos(rot)});\n    }\n    cand.sort(function(u,v){return Math.hypot(u.x-ox,u.y-oy)-Math.hypot(v.x-ox,v.y-oy)});\n    var mx=0,my=0,m;\n    for(m=0;m<A;m++){mx+=cand[m].x;my+=cand[m].y}\n    mx/=A;my/=A;\n    pts=[];\n    for(m=0;m<A;m++) pts.push({k:m,x:CX+cand[m].x-mx+(rnd()-.5)*sp*.14,y:CY+cand[m].y-my+(rnd()-.5)*sp*.14});\n    RN=0; pts.forEach(function(p){RN=Math.max(RN,Math.hypot(p.x-CX,p.y-CY))});\n  }\n  var T={x:CX+RN*.8*Math.cos(-.25),y:CY+RN*.8*Math.sin(-.25)};\n  var convK=pts.map(function(p){return{p:p,d:Math.hypot(p.x-T.x,p.y-T.y)}}).sort(function(u,v){return u.d-v.d})[0].p.k;\n  var i,j,tmp,fixed={};\n  fixed[convK]='n';\n  var T=assignTypes(pts,Z,fixed,rnd);\n  var order=pts.map(function(p){return p.k});\n  for(i=order.length-1;i>0;i--){j=Math.floor(rnd()*(i+1));tmp=order[i];order[i]=order[j];order[j]=tmp}\n  var typeFor=T;\n  var rh='';\n  order.forEach(function(k){if(k!==convK){var p=pts[k];rh+='<circle class=\"dot '+typeFor[k]+'\" cx=\"'+p.x.toFixed(1)+'\" cy=\"'+p.y.toFixed(1)+'\" r=\"'+RD.toFixed(1)+'\"/>'}});\n  var c=pts[convK];\n  rest.innerHTML=rh;\n  topg.innerHTML='<circle id=\"conv\" class=\"dot n\" cx=\"'+c.x.toFixed(1)+'\" cy=\"'+c.y.toFixed(1)+'\" r=\"'+RD.toFixed(1)+'\"/>'\n    +'<circle id=\"ring\" cx=\"'+c.x.toFixed(1)+'\" cy=\"'+c.y.toFixed(1)+'\" r=\"'+(RD+5).toFixed(1)+'\"/>'\n    +'<g id=\"el\"><circle class=\"g\" cx=\"'+c.x.toFixed(1)+'\" cy=\"'+c.y.toFixed(1)+'\" r=\"8\"/><circle class=\"c\" cx=\"'+c.x.toFixed(1)+'\" cy=\"'+c.y.toFixed(1)+'\" r=\"3\"/><\/g>';\n  ring=document.getElementById('ring'); conv=document.getElementById('conv'); el=document.getElementById('el');\n  var fx=c.x+235, fy=c.y-20; EX=fx-c.x; EY=fy-c m\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap\">\n<style>\nhtml{-webkit-text-size-adjust:100%}body{margin:0}\n\n/* Layout wie bei Alpha und Beta: Kopf mit Beispiel und Ton-Knopf, Bühne wie eine Nebelkammer mit dem schattierten Kern, darunter Zähler, Gleichung, Text und Bedienung. Bernstein steht für Energie (Anregung, γ-Quant). */\n:root{\n  --bg:#eef1f4;\n  --bg-glow:rgba(179,98,0,.10);\n  --surface:#ffffff;\n  --fg:#14202b;\n  --muted:#556473;\n  --line:#d2d9e0;\n  --accent:#b3261e;      /* Protonen, Hervorhebung */\n  --accent-ink:#ffffff;\n  --accent-soft:#f8e4e2;\n  --shell:#0b6f7b;       /* Fortschritt, Ton-Knopf */\n  --neutron:#8b98a5;\n  --energy:#b36200;      /* Energie, γ-Quant */\n  --energy-soft:#fbe9cc;\n  --p-hi:#ff9a8f; --p-lo:#8f1812;\n  --n-hi:#d6dde4; --n-lo:#68757f;\n  --edge:rgba(20,32,43,.34);\n  --stage-a:#fbfdfe; --stage-b:#d9e5ec;\n  --grid:rgba(11,111,123,.16);\n  --orbit:rgba(85,100,115,.42);\n  --font-display:\"Bricolage Grotesque\",\"Avenir Next\",\"Segoe UI\",system-ui,sans-serif;\n  --font-body:\"Source Sans 3\",\"Avenir Next\",\"Segoe UI\",system-ui,sans-serif;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#0e161d;--bg-glow:rgba(255,180,84,.08);--surface:#17222c;--fg:#e8eef3;--muted:#9aabb9;--line:#2b3a47;\n    --accent:#ff7d70;--accent-ink:#1c0806;--accent-soft:#3a1d1a;\n    --shell:#52c4d0;--neutron:#8fa1b3;--energy:#ffb454;--energy-soft:#3b2a10;\n    --p-hi:#ffc2ba;--p-lo:#b8372c;--n-hi:#c4d1dd;--n-lo:#566a7c;--edge:rgba(0,0,0,.45);\n    --stage-a:#1f3140;--stage-b:#0d171e;--grid:rgba(130,205,215,.12);--orbit:rgba(154,171,185,.38);\n    color-scheme:dark;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#0e161d;--bg-glow:rgba(255,180,84,.08);--surface:#17222c;--fg:#e8eef3;--muted:#9aabb9;--line:#2b3a47;\n  --accent:#ff7d70;--accent-ink:#1c0806;--accent-soft:#3a1d1a;\n  --shell:#52c4d0;--neutron:#8fa1b3;--energy:#ffb454;--energy-soft:#3b2a10;\n  --p-hi:#ffc2ba;--p-lo:#b8372c;--n-hi:#c4d1dd;--n-lo:#566a7c;--edge:rgba(0,0,0,.45);\n  --stage-a:#1f3140;--stage-b:#0d171e;--grid:rgba(130,205,215,.12);--orbit:rgba(154,171,185,.38);\n  color-scheme:dark;\n}\n*{box-sizing:border-box}\nhtml,body{height:100%}\nbody{\n  background:radial-gradient(900px 420px at 15% -8%,var(--bg-glow),transparent 70%),var(--bg);\n  color:var(--fg);\n  font-family:var(--font-body);font-size:16px;line-height:1.4;\n  padding-block:8px;\n  padding-left:max(16px,env(safe-area-inset-left,0px));\n  padding-right:max(16px,env(safe-area-inset-right,0px));\n  -webkit-text-size-adjust:100%;\n}\nh1,h2{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.15}\np{margin:0}\nbutton{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}\nbutton:focus-visible{outline:3px solid var(--shell);outline-offset:3px}\n\n.app{max-width:1100px;margin-inline:auto;min-height:100%;display:flex;flex-direction:column;gap:8px;min-width:0}\n.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px}\nh1{font-size:clamp(1.8rem,5vw,2.4rem);font-weight:800}\n.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.ex{font-size:.9rem;font-weight:700;padding:9px 12px;border-radius:10px;background:var(--surface);border:2px solid var(--line);font-variant-numeric:tabular-nums}\n.ex span{color:var(--muted);font-weight:600;margin-right:4px}\n.main{display:flex;flex-direction:column;gap:8px}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}\n\n/* Bühne */\n.stagecard{\n  padding:6px 10px 6px;display:flex;flex-direction:column;gap:4px;min-width:0;\n  background:radial-gradient(var(--grid) 1px,transparent 1.6px) 0 0/16px 16px,linear-gradient(160deg,var(--stage-a),var(--stage-b));\n  box-shadow:inset 0 0 0 1px var(--line),0 6px 18px -10px rgba(0,0,0,.35);\n}\n.svgbox{position:relative;width:100%;padding-top:35.8%}\n.svgbox svg{position:absolute;top:0;left:0;width:100%;height:100%;display:block}\n.orbit{fill:none;stroke:var(--orbit);stroke-width:1.2;stroke-dasharray:2 6;stroke-linecap:round}\n.dot{stroke:var(--edge);stroke-width:1}\n.dot.p{fill:url(#gp)}\n.dot.n{fill:url(#gn)}\n#halo{fill:url(#gh);opacity:0;transition:opacity .7s}\n#halo.on{opacity:1;animation:halo 1.3s ease-in-out infinite}\n@keyframes halo{50%{opacity:.5}}\n#rest.excited{animation:jig .4s linear infinite}\n@keyframes jig{0%,100%{transform:translate(0,0)}20%{transform:translate(1.5px,-1px)}40%{transform:translate(-1px,1.3px)}60%{transform:translate(1.1px,1px)}80%{transform:translate(-1.3px,-.8px)}}\n#gam{opacity:0;transition:transform 1.3s cubic-bezier(.35,0,.25,1),opacity .5s}\n#gam path{fill:none;stroke:var(--energy);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}\n#gam polygon{fill:var(--energy)}\n.lbl{font-family:var(--font-body);font-size:16px;font-weight:700;fill:var(--fg);transition:opacity .4s}\n.lbl.nl{font-size:13px;font-weight:600;fill:var(--muted)}\n.lbl.sub{font-weight:600;fill:var(--muted);font-size:14px}\n.hide{opacity:0}\n.legend{display:flex;gap:2px 14px;flex-wrap:wrap;justify-content:center;font-size:.76rem;color:var(--muted)}\n.legend span{display:inline-flex;align-items:center;gap:5px}\n.legend i{width:11px;height:11px;border-radius:50%;display:inline-block}\n.legend .lp{background:var(--accent)}.legend .ln{background:var(--neutron)}.legend .le{background:var(--energy)}\n\n/* Panel */\n.panel{display:flex;flex-direction:column;gap:8px;min-width:0}\n.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}\n.chip{border:1px solid var(--line);border-radius:10px;padding:3px 8px;background:var(--surface);min-width:0;display:flex;justify-content:space-between;align-items:baseline;gap:6px}\n.chip small{color:var(--muted);font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}\n.chip b{font-family:var(--font-display);font-size:1.2rem;font-weight:800;font-variant-numeric:tabular-nums}\n.chip.hl{border-color:var(--accent);background:var(--accent-soft)}\n.chip.hl b{color:var(--accent)}\n\n.eqcard{padding:8px 8px 6px;display:flex;flex-direction:column;gap:6px}\n.eq{display:flex;align-items:flex-start;justify-content:center;gap:clamp(2px,1.4vw,12px);flex-wrap:wrap}\n.term{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}\n.term small{color:var(--muted);font-size:.72rem;font-weight:600;text-align:center;line-height:1.2}\n.op{font-family:var(--font-display);font-size:1.5rem;line-height:1.7;color:var(--muted);font-weight:600}\n.nuc{display:inline-flex;align-items:center;gap:2px;font-family:var(--font-display);font-weight:800;font-size:clamp(1.6rem,4.6vw,2.15rem);line-height:1;padding:3px 5px;border-radius:10px}\n.nuc .ab{display:inline-flex;flex-direction:column;gap:3px;font-size:.52em;text-align:right;font-variant-numeric:tabular-nums}\n.nuc .ab i{font-style:normal;padding:0 3px;border-radius:6px;border:2px solid transparent;min-width:1.4em}\n.nuc b{font-weight:800;padding:0 4px;border-radius:6px;border:2px solid transparent}\n.unk{color:var(--muted);border-color:var(--line)!important;border-style:dashed!important}\n.hl{background:var(--accent-soft);border-color:var(--accent)!important;color:var(--accent)}\n.star{color:var(--energy)}\n.calc{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;min-height:2.3rem;font-variant-numeric:tabular-nums}\n.calc p{font-weight:600;font-size:.9rem;padding:2px 10px;border-radius:9px;background:var(--bg);border:1px solid var(--line)}\n.calc p.new{border-color:var(--accent);background:var(--accent-soft)}\n\n.text{padding:9px 14px}\n.tstack{display:grid}\n.tstep{grid-area:1/1;visibility:hidden;display:flex;flex-direction:column;gap:2px}\n.tstep.on{visibility:visible}\n.tstep h2{font-size:1.1rem;font-weight:600}\n.tstep p{font-size:.95rem}\n\n/* Bedienung */\n.nav{position:sticky;bottom:0;background:var(--bg);display:flex;gap:8px;align-items:center;padding-block:4px 2px;padding-bottom:max(2px,env(safe-area-inset-bottom,0px))}\n.btn{min-height:52px;padding:0 18px;border-radius:12px;border:2px solid transparent;font-weight:700;font-size:1rem;cursor:pointer;flex:none;min-width:104px}\n.btn.primary{background:var(--accent);color:var(--accent-ink)}\n.btn.ghost{background:var(--surface);border-color:var(--line)}\n.btn:disabled{opacity:.4;cursor:not-allowed}\n.segs{flex:1;display:flex;gap:4px;min-width:0}\n.seg{flex:1;min-width:0;height:44px;border:0;background:transparent;padding:0;cursor:pointer;display:flex;align-items:center}\n.seg span{display:block;width:100%;height:8px;border-radius:3px;background:var(--line)}\n.seg.done span{background:var(--shell)}\n.seg.cur span{background:var(--accent)}\n\n@media (min-width:820px) and (orientation:landscape){\n  .main{flex-direction:row;align-items:center}\n  .stagecard{flex:1.1 1 0}\n  .panel{flex:1 1 0}\n}\n@media (prefers-reduced-motion:reduce){#gam{transition:none}#halo.on,#rest.excited{animation:none}}\n<\/style><style>.stagecard{position:relative}.warn{position:absolute;left:6px;top:6px;width:clamp(34px,4.2vw,46px);aspect-ratio:1;z-index:5;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}.warn svg{display:block;width:100%;height:100%}.head h1{display:none}.head{justify-content:flex-start}html,body{background:var(--bg)!important}<\/style><\/head><body>\n\n<div class=\"app\">\n  <header class=\"head\">\n    <h1>Gamma-Zerfall<\/h1>\n    <div class=\"tools\">\n      <p class=\"ex\"><span>Beispiel<\/span>Kobalt-60 → Nickel-60<\/p>\n    <\/div>\n  <\/header>\n\n  <div class=\"main\">\n    <section class=\"card stagecard\" aria-label=\"Darstellung des Atomkerns\">\n      <div class=\"svgbox\">\n        <svg id=\"stage\" viewBox=\"0 0 600 215\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"Atomkern, der ein Gammaquant aussendet\">\n          <defs>\n            <radialGradient id=\"gp\" cx=\".35\" cy=\".3\" r=\".85\"><stop offset=\"0\" style=\"stop-color:var(--p-hi)\"/><stop offset=\".5\" style=\"stop-color:var(--accent)\"/><stop offset=\"1\" style=\"stop-color:var(--p-lo)\"/><\/radialGradient>\n            <radialGradient id=\"gn\" cx=\".35\" cy=\".3\" r=\".85\"><stop offset=\"0\" style=\"stop-color:var(--n-hi)\"/><stop offset=\".5\" style=\"stop-color:var(--neutron)\"/><stop offset=\"1\" style=\"stop-color:var(--n-lo)\"/><\/radialGradient>\n            <radialGradient id=\"gh\"><stop offset=\"0\" style=\"stop-color:var(--energy);stop-opacity:.55\"/><stop offset=\".7\" style=\"stop-color:var(--energy);stop-opacity:.25\"/><stop offset=\"1\" style=\"stop-color:var(--energy);stop-opacity:0\"/><\/radialGradient>\n            <radialGradient id=\"gg\"><stop offset=\"0\" style=\"stop-color:var(--shell);stop-opacity:.3\"/><stop offset=\"1\" style=\"stop-color:var(--shell);stop-opacity:0\"/><\/radialGradient>\n          <\/defs>\n          <circle id=\"glow\" cx=\"150\" cy=\"92\" r=\"112\" fill=\"url(#gg)\"/>\n          <ellipse id=\"o1\" class=\"orbit\" cx=\"150\" cy=\"92\" rx=\"118\" ry=\"42\" transform=\"rotate(26 150 92)\"/>\n          <ellipse id=\"o2\" class=\"orbit\" cx=\"150\" cy=\"92\" rx=\"118\" ry=\"42\" transform=\"rotate(-26 150 92)\"/>\n          <circle id=\"halo\" cx=\"150\" cy=\"92\" r=\"84\"/>\n          <g id=\"rest\"><\/g>\n          <g id=\"gam\"><\/g>\n          <text id=\"lblNuc\" class=\"lbl nl\" text-anchor=\"middle\"><\/text>\n          <text id=\"lblG\" class=\"lbl hide\" text-anchor=\"middle\">γ-Quant<\/text>\n          <text id=\"lblG2\" class=\"lbl sub hide\" text-anchor=\"middle\">= Gammastrahlung<\/text>\n        <\/svg>\n      <\/div>\n      <div class=\"legend\"><span><i class=\"lp\"><\/i>Proton (positiv)<\/span><span><i class=\"ln\"><\/i>Neutron (neutral)<\/span><span><i class=\"le\"><\/i>Energie / γ-Quant<\/span><span>vereinfachtes Modell<\/span><\/div>\n    <\/section>\n\n    <div class=\"panel\">\n      <div class=\"chips\" id=\"chips\"><\/div>\n      <section class=\"card eqcard\" aria-label=\"Zerfallsgleichung\">\n        <div class=\"eq\" id=\"eq\"><\/div>\n        <div class=\"calc\" id=\"calc\"><\/div>\n      <\/section>\n      <section class=\"card text\"><div class=\"tstack\" id=\"tstack\"><\/div><\/section>\n      <div class=\"nav\">\n        <button type=\"button\" class=\"btn ghost\" id=\"prev\">Zurück<\/button>\n        <div class=\"segs\" id=\"segs\" aria-label=\"Schritte\"><\/div>\n        <button type=\"button\" class=\"btn primary\" id=\"next\">Weiter<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\n/* ---------- Beispiel: Co-60 zerfällt zu angeregtem Ni-60, dieses gibt ein γ-Quant ab ---------- */\nvar A=60, Z=28, N=32, NS=6, step=0;\n\n/* ---------- Kern zeichnen ---------- */\nvar CX=150, CY=92, RD=8.2, RN=52;\nfunction rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}\n/* Protonen und Neutronen gleichmäßig verteilen: Nachbarn gleicher Sorte werden durch Tauschen möglichst vermieden */\nfunction assignTypes(pts,nP,fixed,rnd){\n  var A=pts.length,T=[],free=[],pLeft=nP,i,j,t,a,b;\n  Object.keys(fixed).forEach(function(key){if(fixed[key]==='p')pLeft--});\n  for(i=0;i<A;i++){if(fixed[i])T[i]=fixed[i];else free.push(i)}\n  var pool=[];for(i=0;i<free.length;i++)pool.push(i<pLeft?'p':'n');\n  for(i=pool.length-1;i>0;i--){j=Math.floor(rnd()*(i+1));t=pool[i];pool[i]=pool[j];pool[j]=t}\n  free.forEach(function(k,x){T[k]=pool[x]});\n  var dm=1e9;\n  for(i=0;i<A;i++)for(j=i+1;j<A;j++){var d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);if(d<dm)dm=d}\n  var thr=dm*1.7,nb=[];\n  for(i=0;i<A;i++){nb[i]=[];for(j=0;j<A;j++)if(j!==i&&Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y)<thr)nb[i].push(j)}\n  function same(k){var c=0;for(var q=0;q<nb[k].length;q++)if(T[nb[k][q]]===T[k])c++;return c}\n  for(var it=0;it<9000&&free.length>1;it++){\n    a=free[Math.floor(rnd()*free.length)];b=free[Math.floor(rnd()*free.length)];\n    if(T[a]===T[b])continue;\n    var before=same(a)+same(b);\n    t=T[a];T[a]=T[b];T[b]=t;\n    if(same(a)+same(b)>before){t=T[a];T[a]=T[b];T[b]=t}\n  }\n  return T;\n}\nvar rest=document.getElementById('rest'), halo=document.getElementById('halo'), gam=document.getElementById('gam'), lblNuc=document.getElementById('lblNuc');\nvar lg=document.getElementById('lblG'), lg2=document.getElementById('lblG2');\n(function build(){\n  var rnd=rng(6028), dmin=9.9, cell=dmin, grid={}, pts=[], tries=0;\n  while(pts.length<A){\n    if(++tries>30000){dmin-=0.2;tries=0}\n    var rr=RN*1.02*Math.sqrt(rnd()), tt=rnd()*6.283185;\n    var x=CX+rr*Math.cos(tt), y=CY+rr*Math.sin(tt), ix=Math.floor(x/cell), iy=Math.floor(y/cell), ok=true;\n    for(var a=-1;a<=1&&ok;a++)for(var b=-1;b<=1&&ok;b++){\n      var L=grid[(ix+a)*1000+(iy+b)];\n      if(L)for(var q=0;q<L.length;q++){var dx=L[q].x-x,dy=L[q].y-y;if(dx*dx+dy*dy<dmin*dmin){ok=false;break}}\n    }\n    if(ok){var P={x:x,y:y};pts.push(P);(grid[ix*1000+iy]=grid[ix*1000+iy]||[]).push(P)}\n  }\n  var types=assignTypes(pts,Z,{},rnd);\n  var h='';\n  pts.forEach(function(p,k){h+='<circle class=\"dot '+types[k]+'\" cx=\"'+p.x.toFixed(1)+'\" cy=\"'+p.y.toFixed(1)+'\" r=\"'+RD+'\"/>'});\n  rest.innerHTML=h;\n  var x0=CX+24, y0=CY-8, d='M'+x0+','+y0;\n  for(var u=2;u<=84;u+=2){d+=' L'+(x0+u)+','+(y0+7*Math.sin(u/20*6.283185)).toFixed(1)}\n  gam.innerHTML='<path d=\"'+d+'\"/><polygon points=\"'+(x0+84)+','+(y0-8)+' '+(x0+102)+','+y0+' '+(x0+84)+','+(y0+8)+'\"/>';\n  lblNuc.setAttribute('x',CX); lblNuc.setAttribute('y',(CY+RN*1.02+RD+30).toFixed(0));\n  var gx=x0+270+50;\n  lg.setAttribute('x',gx);lg.setAttribute('y',y0+34);lg2.setAttribute('x',gx);lg2.setAttribute('y',y0+52);\n})();\n\n/* ---------- Texte ---------- */\nvar STEPS=[\n {t:\"Ausgangslage: ein angeregter Kern\",\n  b:\"Kobalt-60 zerfällt durch β⁻-Zerfall zu Nickel-60. Der neue Kern hat 28 Protonen und 32 Neutronen, aber noch zu viel Energie. Man sagt, er ist angeregt, und kennzeichnet das mit einem Stern: Ni*.\"},\n {t:\"Der Kern gibt Energie ab\",\n  b:\"Der angeregte Kern wird seine überschüssige Energie los. Er sendet sie als γ-Quant aus, einen energiereichen Strahlungsblitz, ähnlich wie Licht oder Röntgenstrahlung, nur noch energiereicher.\"},\n {t:\"Was ist ein γ-Quant?\",\n  b:\"Ein γ-Quant ist kein Teilchen mit Masse und Ladung. Es hat weder Masse noch elektrische Ladung, deshalb schreibt man ⁰₀γ. Gammastrahlung durchdringt Stoffe sehr stark und wird erst von dicken Blei- oder Betonschichten gut abgeschirmt.\"},\n {t:\"Die Massenzahl bleibt gleich\",\n  b:\"Das γ-Quant nimmt keine Nukleonen mit. Der Kern hat deshalb weiterhin 60 − 0 = 60 Nukleonen. Die Nukleonenzahl A oben links ändert sich nicht.\"},\n {t:\"Die Ordnungszahl bleibt gleich\",\n  b:\"Auch kein Proton geht verloren. Es bleibt bei 28 − 0 = 28 Protonen, also bei Z = 28. Die Ordnungszahl unten links ändert sich nicht.\"},\n {t:\"Kein neues Element, nur weniger Energie\",\n  b:\"Der Kern bleibt Nickel-60, ist aber jetzt im Grundzustand. Der Stern fällt weg. Bei Kobalt-60 gibt der Kern in Wirklichkeit nacheinander zwei γ-Quanten ab, hier ist das vereinfacht als ein Schritt gezeigt. Wegen der durchdringenden Strahlung wurde Kobalt-60 zur Bestrahlung von Tumoren genutzt.\"}\n];\ndocument.getElementById('tstack').innerHTML=STEPS.map(function(s,i){return '<div class=\"tstep\" id=\"ts'+i+'\"><h2>'+s.t+'<\/h2><p>'+s.b+'<\/p><\/div>'}).join('');\n\nfunction nuc(a,z,s,o){\n  o=o||{};\n  return '<span class=\"nuc\"><span class=\"ab\"><i class=\"'+(o.a||'')+'\">'+a+'<\/i><i class=\"'+(o.z||'')+'\">'+z+'<\/i><\/span><b class=\"'+(o.s||'')+'\">'+s+'<\/b><\/span>';\n}\nfunction term(h,label){return '<div class=\"term\">'+h+'<small>'+label+'<\/small><\/div>'}\nfunction chip(label,val,hl){return '<div class=\"chip'+(hl?' hl':'')+'\"><small>'+label+'<\/small><b>' ;c.insertBefore(w,c.firstChild)})();<\/script><\/body><\/html>"};
